services:
  email-signature:
    build:
      context: .
      dockerfile: Dockerfile
    image: rs-tool-email-signature:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      EMAIL_SIGNATURE_API_KEY: ${EMAIL_SIGNATURE_API_KEY:-}
      API_KEY: ${API_KEY:-}
      RS_TOOLS_API_KEY: ${RS_TOOLS_API_KEY:-}
      EASYCOMMS_WEBHOOK_URL: ${EASYCOMMS_WEBHOOK_URL:-}
      EASYCOMMS_WEBHOOK_TOKEN: ${EASYCOMMS_WEBHOOK_TOKEN:-}
      EASYCOMMS_WEBHOOK_TIMEOUT_MS: ${EASYCOMMS_WEBHOOK_TIMEOUT_MS:-10000}
      EMAIL_SIGNATURE_WEBHOOK_URL: ${EMAIL_SIGNATURE_WEBHOOK_URL:-}
      EMAIL_SIGNATURE_WEBHOOK_TOKEN: ${EMAIL_SIGNATURE_WEBHOOK_TOKEN:-}
      EMAIL_SIGNATURE_ALLOWED_DOMAINS: ${EMAIL_SIGNATURE_ALLOWED_DOMAINS:-romega-solutions.com}
      PUBLIC_EMAIL_SIGNATURE_BASE_URL: ${PUBLIC_EMAIL_SIGNATURE_BASE_URL:-http://localhost:4321}
    ports:
      - "4321:4321"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:4321/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
