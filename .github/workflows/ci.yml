name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build --if-present
      - name: Headless and MCP smoke
        timeout-minutes: 3
        shell: bash
        run: |
          EMAIL_SIGNATURE_API_KEY=qa-email-signature-key PORT=3005 HOST=127.0.0.1 npm start > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3005/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3005/api/health >/dev/null
          EMAIL_SIGNATURE_API_KEY=qa-email-signature-key BASE_URL=http://127.0.0.1:3005 npm run qa:headless
          EMAIL_SIGNATURE_API_KEY=qa-email-signature-key EMAIL_SIGNATURE_BASE_URL=http://127.0.0.1:3005 npm run mcp:smoke
      - run: npm test --if-present
